version: 2.1

jobs:
  reload_dec10-smoke:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: orbital pass
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; seq 1 1127410 | awk '{print $1*7919 % 2147483647}' > /tmp/share/.ready; true
            len=$(wc -c </tmp/share/.ready); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - .ready
  dec10-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Pull handoff
          command: |
            wc -c /tmp/share/.ready || true
      - run:
          name: Get project
          command: git clone --depth 2 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar -xf cache.tar
      - run:
          name: Hash artifacts
          command: cmake --version
      - run:
          name: Validate binary
          command: cmake --version
      - run:
          no_output_timeout: 66m
